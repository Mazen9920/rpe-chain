[project]
name = "rpe-gear"
version = "0.3.1"
description = "RPE Gear supply OS — Python rewrite per PDF v2.0 spec"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "fastapi-users[sqlalchemy]>=14.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "PyJWT>=2.10",
    "structlog>=24.4",
    "python-json-logger>=2.0",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "qrcode[pil]>=8.0",
    "reportlab>=4.2",
    "cryptography>=44.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
    "types-passlib",
    "asgi-lifespan>=2.1",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/", "build/"]

[[tool.mypy.overrides]]
module = ["pyotp", "qrcode.*", "reportlab.*", "celery.*", "slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/migrations/*"]

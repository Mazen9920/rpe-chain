# RPE Chain Supply OS — full-stack docker-compose
#
# Boot the entire stack:
#     docker compose up --build
# Then:
#     frontend  http://localhost:8080
#     backend   http://localhost:3000/api/health
#     postgres  localhost:5432
#
# Override defaults via a local `.env` file at the repo root.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rpe_supply_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rpe_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rpe_supply}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rpe_user} -d ${POSTGRES_DB:-rpe_supply}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: rpe_supply_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://rpe_user:rpe_pass@postgres:5432/rpe_supply}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_DAILY_ON_BOOT: ${RUN_DAILY_ON_BOOT:-false}
      DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      # Section 9 — Integrations
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-rpe-chain}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@rpechain.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-RPE Chain}
      SHOPIFY_SHOP: ${SHOPIFY_SHOP:-}
      SHOPIFY_ADMIN_TOKEN: ${SHOPIFY_ADMIN_TOKEN:-}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2024-10}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-}
      SHOPIFY_DEFAULT_WAREHOUSE_ID: ${SHOPIFY_DEFAULT_WAREHOUSE_ID:-}
      BOSTA_API_BASE: ${BOSTA_API_BASE:-https://app.bosta.co/api/v2}
      BOSTA_API_KEY: ${BOSTA_API_KEY:-}
      BOSTA_WEBHOOK_SECRET: ${BOSTA_WEBHOOK_SECRET:-}
      BOSTA_BUSINESS_LOCATION_ID: ${BOSTA_BUSINESS_LOCATION_ID:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: rpe_supply_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rpe_supply_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rpegear.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    container_name: rpe_supply_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio-init:
    image: minio/mc:latest
    container_name: rpe_supply_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb -p local/${STORAGE_BUCKET:-rpe-chain} || true &&
      echo 'MinIO bucket ready';
      "
    restart: "no"

volumes:
  pgdata:
  uploads:
  minio-data:
